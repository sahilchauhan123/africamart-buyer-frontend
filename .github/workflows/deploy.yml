name: Deploy Buyer App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.lasomaa.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://api.lasomaa.com/api/v1/messaging/ws
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "191606077807-pi41pab7ncr6357t02c0fm4gl13oorlg.apps.googleusercontent.com"
        run: npm run build

      - name: Create deployment package
        run: tar -czf release.tar.gz .next public package.json package-lock.json next.config.ts tsconfig.json

      - name: Copy package via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "release.tar.gz"
          target: "/tmp/"

      - name: Extract and Restart on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure target directory exists and is clean
            mkdir -p /var/www/africamart/buyer-app
            rm -rf /var/www/africamart/buyer-app/*
            
            # Extract new release
            tar -xzf /tmp/release.tar.gz -C /var/www/africamart/buyer-app/
            cd /var/www/africamart/buyer-app/
            
            # Install production dependencies
            npm install --production
            
            # Clean up old process names and start new one
            pm2 delete Lasomaa-buyer africamart-buyer || true
            pm2 start npm --name "Lasomaa-buyer" -- start -- -p 3000
            
            # Persist across reboots
            pm2 save
            pm2 startup systemd -u root --hp /root || true
            systemctl enable pm2-root || true
